<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Edit Profile</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body id="proflePage">

  <main class="profile-container">
    <header class="profile-header">
      <h1>Edit Profile</h1>
      <p>Update your personal information and public profile details.</p>
    </header>

    <form class="profile-form" id="profileForm">
      
      <section class="avatar-section">
        <div class="avatar-wrapper">
          <img src="https://via.placeholder.com/120" id="profileImg" alt="User Profile Picture" id="avatarPreview">
          <label for="avatarInput" class="avatar-upload-btn" title="Upload new photo">
            📷
          </label>
          <input type="file" id="avatarInput" accept="image/*" hidden>
        </div>
        <div class="avatar-info">
          <h3>Profile Picture</h3>
          <p>PNG, JPG or GIF. Max size 2MB.</p>
        </div>
      </section>

      <hr class="divider">

      <div class="form-grid">
        
        <div class="form-group">
          <label for="firstName">Name</label>
          <input type="text" id="name" name="name"  required>
        </div>


        <div class="form-group full-width">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" required>
        </div>


        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="tel" id="contact" name="contact" >
        </div>

        <div class="form-group">
          <label for="location">Location</label>
          <input type="text" id="country" name="country" >
        </div>

      </div>

      <hr class="divider">

      <footer class="form-actions">
        <button type="button" class="btn btn-secondary">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Changes</button>
      </footer>

    </form>
  </main>
<script type="module" src="../index.js"></script>
</body>
</html>
