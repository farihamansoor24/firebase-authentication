<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Form</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">
<h1 class="msg mb-20" id="alert-msg"></h1>
        <form class="login-form" id="login-form">

            <h2>Welcome Back</h2>
            <p>Login to your account</p>

            <div class="input-box">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-box">
                <label>Password</label>
                <input type="password" id="password" placeholder="Enter your password" required>
            </div>

            <div class="options">
                <!-- <label>
                    <input type="checkbox" id="role" name="role" value="admin">
                    Admin
                </label> -->

                <a href="#" id="forgotPasswordLink">Forgot Password?</a>
            </div>

            <button type="submit" id="login" class="login-button sign-up-btn">Login</button>

            <button type="button" id="googleLoginBtn" class="google-btn social-btn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="Google Logo">
    <span>Sign in with Google</span>
</button>

<button type="button" id="facebookLoginBtn" class="btn-fb social-btn">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor">
        <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z" />
    </svg>
    <span>Sign in with Facebook</span>
</button>
            <p class="signup-link">
                Don't have an account?
                <a href="./sign-up.html">Sign Up</a>
            </p>

        </form>
        <!-- Forgot Password Trigger Link/Button -->

<!-- Forgot Password Modal -->
<dialog id="forgotPasswordModal" class="reset-modal">
  <div class="modal-content">
    <h2>Reset Password</h2>
    <p>Enter your account's email address to receive a password reset link.</p>
    
    <form id="resetPasswordForm" method="dialog">
      <div class="form-group">
        <label for="resetEmail">Email Address</label>
        <input type="email" id="resetEmail" placeholder="name@example.com" required />
      </div>

      <div id="modalStatus" class="status-message"></div>

      <div class="modal-actions">
        <button type="button" id="closeModalBtn" class="btn-secondary">Cancel</button>
        <button type="submit" id="sendResetBtn" class="btn-primary">Send Reset Link</button>
      </div>
    </form>
  </div>
</dialog>

    </div>
    <script type="module" src="./js/index.js"></script>

</body>

</html>
