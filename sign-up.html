<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     
    <div class="container">
        <h1 class="msg mb-20" id="alert-msg"></h1>
        <form class="signup-form" id="signup-form">

            <h2>Create Account</h2>
            <p>Join us today!</p>

            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>
            </div>

            <div class="input-group">
                <label>Email Address</label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password" id="password" placeholder="Create password" required>
            </div>

            <div class="input-group">
                <label>Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Confirm password" required>
            </div>
            <div class="input-group">
                <label>Contact Number</label>
                <input type="tel" id="contact" placeholder="Enter your contact number" required>
            </div>
            <div class="input-group">
                <label>Country</label>
                <select  name="country" id="country" required>
                    <option value="">Select Country</option>
                    <option value="India">India</option>
                    <option value="Pakistan">Pakistan</option>
                    <option value="United Arab Emirates">United Arab Emirates</option>
                    <option value="United States">United States</option>
                    <option value="United Kingdom">United Kingdom</option>
                </select>
            </div>

            <div class="checkbox">
                <input type="checkbox" id="terms">
                <label for="terms">
                    I agree to the Terms & Conditions
                </label>
            </div>

            <button id="sign-up" class="sign-up-btn " type="submit">Sign Up</button>
     <button type="button" id="googleLoginBtn" class="google-btn sign-up-btn">
    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg"  alt="Google Logo">
    Sign in with Google </button>

   <button type="button" class="btn-fb sign-up-btn" id="facebookLoginBtn">
    <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
      <path d="M24 12.073c0-6.627-5.373-12-12-12s-12 5.373-12 12c0 5.99 4.388 10.954 10.125 11.854v-8.385H7.078v-3.47h3.047V9.43c0-3.007 1.792-4.669 4.533-4.669 1.312 0 2.686.235 2.686.235v2.953H15.83c-1.491 0-1.956.925-1.956 1.874v2.25h3.328l-.532 3.47h-2.796v8.385C19.612 23.027 24 18.062 24 12.073z"/>
    </svg>
    <span>Sign in with Facebook</span>
  </button>

            <p class="login-link">
                Already have an account?
                <a href="./login.html">Login</a>
            </p>

        </form>
    </div>
<script type="module" src="index.js"></script>
</body>
</html>
