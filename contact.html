<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
 <!-- Header -->
    <header>
        <nav class="navbar">
            <h2 class="logo">MyApp</h2>
            <ul class="nav-links">          
               <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-buttons">
                <button id="loginBtn" class="btn btn-nav" onclick="window.location.href='login.html'">Login</button>
                <button id="registerBtn" class="btn btn-nav" onclick="window.location.href='register.html'">Register</button>
            </div>
        </nav>
    </header>

    <main>
        <h1>Contact Us</h1>
        <form>
            <div>
                <label>Name:</label><br>
                <input type="text" placeholder="Your Name" required>
            </div>
            <br>
            <div>
                <label>Email:</label><br>
                <input type="email" placeholder="Your Email" required>
            </div>
            <br>
            <div>
                <label>Message:</label><br>
                <textarea rows="5" placeholder="Write your message here..." required></textarea>
            </div>
            <br>
            <button type="submit">Send Message</button>
        </form>
    </main>
       <!-- Footer -->
    <footer>
        <p>© 2026 MyApp. All Rights Reserved.</p>
    </footer>
</body>
</html>
